<div class="inst-dashboard">

  <div class="inst-body">

    <!-- Sidebar -->
    <nav class="inst-sidebar" aria-label="Instructor dashboard navigation">

      <!-- Instructor badge at top of sidebar -->
      <div class="sidebar-header">
        <span class="inst-badge">Instructor view</span>
      </div>

      <a
        routerLink="overview"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">⊞</span>
        Overview
      </a>
      <a
        routerLink="students"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">◻</span>
        Students
      </a>
      <a
        routerLink="integrity"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">⚑</span>
        Integrity
      </a>
      <a
        routerLink="contests"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">🏆</span>
        Contests
      </a>

      <!-- Logged-in user at bottom of sidebar -->
      <div class="sidebar-footer">
        <a
          routerLink="/instructor/profile"
          routerLinkActive="active"
          class="nav-item sidebar-profile-link"
          [attr.aria-label]="'View profile for ' + auth.user()?.name"
        >
          <span class="sidebar-avatar" aria-hidden="true">
            {{ auth.user()?.avatarInitials }}
          </span>
          <span class="inst-user">{{ auth.user()?.name }}</span>
        </a>
      </div>

    </nav>

    <!-- Main content -->
    <div class="inst-main">
      <router-outlet />
    </div>

  </div>

</div>
