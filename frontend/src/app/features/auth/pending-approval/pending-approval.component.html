<div class="auth-container">
  <div class="auth-card">

    <!-- Clock icon -->
    <div class="pending-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>

    <h1>Request Received</h1>
    <p class="subtitle">
      Your instructor account is pending admin approval.
      We'll send you an email once your account is activated.
    </p>

    <div class="info-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>This usually takes 1–2 business days. Check your inbox for updates.</span>
    </div>

    <a routerLink="/auth/login" class="btn-secondary">Back to Login</a>

  </div>
</div>
