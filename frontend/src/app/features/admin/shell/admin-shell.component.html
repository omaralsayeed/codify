<div class="admin-panel">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <nav class="admin-sidebar" aria-label="Admin panel navigation">

    <!-- Brand -->
    <div class="sidebar-brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Codify</span>
      <span class="brand-badge">Admin</span>
    </div>

    <!-- Nav links -->
    <div class="sidebar-nav">
      <a
        routerLink="overview"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Overview"
      >
        <span class="nav-icon" aria-hidden="true">⊞</span>
        <span class="nav-label">Overview</span>
      </a>

      <a
        routerLink="users"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Users"
      >
        <span class="nav-icon" aria-hidden="true">👥</span>
        <span class="nav-label">Users</span>
      </a>

      <a
        routerLink="problems"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
        aria-label="Problems"
      >
        <span class="nav-icon" aria-hidden="true">🗂</span>
        <span class="nav-label">Problems</span>
      </a>
    </div>

    <!-- Footer: admin name + logout -->
    <div class="sidebar-footer">
      <div class="admin-user">
        <div class="admin-avatar" aria-hidden="true">
          {{ auth.user()?.avatarInitials }}
        </div>
        <div class="admin-info">
          <span class="admin-name">{{ auth.user()?.name }}</span>
          <span class="admin-role">Administrator</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" aria-label="Log out">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-label">Log out</span>
      </button>
    </div>

  </nav>

  <!-- ── Main content ────────────────────────────────────── -->
  <main class="admin-main">
    <router-outlet />
  </main>

</div>
