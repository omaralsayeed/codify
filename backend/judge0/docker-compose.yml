version: "3.8"

services:

  db:
    image: postgres:15-alpine
    container_name: judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-db:/var/lib/postgresql/data
    networks:
      - judge0-network

  redis:
    image: redis:7-alpine
    container_name: judge0-redis
    networks:
      - judge0-network

  server:
    image: mrkushalsm/judge0:latest
    container_name: judge0-server
    privileged: true
    cgroup: host
    ports:
      - "2358:2358"
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0

      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379

      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"

    volumes:
      - judge0-box:/box

    networks:
      - judge0-network

  worker:
    image: mrkushalsm/judge0:latest
    container_name: judge0-worker
    privileged: true
    cgroup: host
    command: /api/scripts/workers
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0

      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379

      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      
      # ── Concurrency tuning ─────────────────────────────────────────
      # COUNT: Number of parallel worker processes (default 1-2)
      # Increase to 4-8 for better throughput with batch submissions
      COUNT: "6"
      
      # MAX_QUEUE_SIZE: Maximum number of submissions in the queue
      # Higher values allow more submissions to be queued without rejection
      MAX_QUEUE_SIZE: "200"
      
      # WORKERS_COUNT: Worker threads per process (default varies by setup)
      # This controls how many isolate boxes can run in parallel per worker process
      WORKERS_COUNT: "4"

    volumes:
      - judge0-box:/box

    networks:
      - judge0-network
    
    # Deploy multiple worker replicas for even better concurrency
    # Uncomment to run 2 worker containers
    # deploy:
    #   replicas: 2

volumes:
  judge0-db:
  judge0-box:

networks:
  judge0-network: